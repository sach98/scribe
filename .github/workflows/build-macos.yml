# macOS (Apple Silicon) build. Produces an unsigned, ad-hoc-signed Scribe.app
# artifact. Trigger manually from the Actions tab.
name: Scribe macOS build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend deps
        run: bun install
      - name: VAD model
        run: |
          mkdir -p src-tauri/resources/models
          curl -o src-tauri/resources/models/silero_vad_v4.onnx https://blob.handy.computer/silero_vad_v4.onnx
      - name: Build (unsigned/ad-hoc)
        run: bun run tauri build -- --bundles app
      - name: Package app bundle (preserve permissions)
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf Scribe.app.tar.gz *.app
      - uses: actions/upload-artifact@v4
        with:
          name: scribe-macos-arm64
          path: src-tauri/target/release/bundle/macos/Scribe.app.tar.gz
