# macOS (Apple Silicon) build. Produces an unsigned, ad-hoc-signed Scribe.app
# artifact. Trigger manually from the Actions tab.
name: Scribe macOS build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend deps
        run: bun install
      - name: VAD model
        run: |
          mkdir -p src-tauri/resources/models
          curl -o src-tauri/resources/models/silero_vad_v4.onnx https://blob.handy.computer/silero_vad_v4.onnx
      - name: Build (unsigned/ad-hoc)
        run: bun run tauri build --target aarch64-apple-darwin
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Package app bundle (preserve permissions)
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          tar -czf "$GITHUB_WORKSPACE/Scribe.app.tar.gz" *.app
      - uses: actions/upload-artifact@v4
        with:
          name: scribe-macos-arm64
          path: Scribe.app.tar.gz
          if-no-files-found: error
